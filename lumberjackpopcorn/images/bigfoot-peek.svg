<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290">
  <style>
    .eyes { animation: blink 5s infinite; transform-origin: 170px 124px; }
    .peek { animation: peek 7s ease-in-out infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes peek { 0%,60%,100% { transform: translateX(0); } 70%,85% { transform: translateX(-10px); } }
    @media (prefers-reduced-motion: reduce) { .eyes, .peek { animation: none; } }
  </style>
  <g class="peek">
    <!-- body behind the tree -->
    <path d="M128 170 C150 150 205 150 222 180 L232 290 L130 290 Z" fill="#8b4a1f" stroke="#10281a" stroke-width="4" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M132 126 C130 86 152 70 172 70 C196 70 214 90 212 124 C211 152 196 166 172 166 C150 166 133 154 132 126 Z" fill="#8b4a1f" stroke="#10281a" stroke-width="4"/>
    <path d="M150 82 l6 -12 l6 10 l6 -13 l6 12 l6 -10 l5 12" fill="#8b4a1f" stroke="#10281a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M146 118 C146 102 158 96 172 96 C188 96 200 104 199 120 C198 142 188 156 172 156 C156 156 146 140 146 118 Z" fill="#e0a878" stroke="#10281a" stroke-width="3"/>
    <path d="M150 106 Q162 98 172 105 M176 105 Q188 98 198 107" stroke="#6e3814" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g class="eyes">
      <ellipse cx="161" cy="121" rx="8" ry="9" fill="#fff" stroke="#10281a" stroke-width="2.5"/>
      <ellipse cx="185" cy="121" rx="8" ry="9" fill="#fff" stroke="#10281a" stroke-width="2.5"/>
      <circle cx="158" cy="123" r="4" fill="#10281a"/>
      <circle cx="182" cy="123" r="4" fill="#10281a"/>
    </g>
    <ellipse cx="173" cy="136" rx="7" ry="5" fill="#b8744a"/>
    <path d="M160 145 Q173 154 188 144" stroke="#10281a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M166 148 l3 5 l3 -4" fill="#fff" stroke="#10281a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- the tree he's hiding behind -->
  <rect x="79.2" y="250.9" width="25.6" height="37.1" fill="#5a3a22" stroke="#10281a" stroke-width="4" stroke-linejoin="round"/><polygon points="92.0,-34.1 137.6,79.9 114.8,68.5 92.0,79.9 69.2,68.5 46.4,79.9" fill="#183a1e" stroke="#10281a" stroke-width="4" stroke-linejoin="round"/><polygon points="92.0,-32.1 135.6,78.9 114.8,68.5 92.0,78.9" fill="#12301a"/><polygon points="92.0,28.6 160.4,148.3 126.2,136.9 92.0,148.3 57.8,136.9 23.6,148.3" fill="#183a1e" stroke="#10281a" stroke-width="4" stroke-linejoin="round"/><polygon points="92.0,30.6 158.4,147.3 126.2,136.9 92.0,147.3" fill="#12301a"/><polygon points="92.0,91.3 183.2,216.8 137.6,205.3 92.0,216.8 46.4,205.3 0.8,216.8" fill="#183a1e" stroke="#10281a" stroke-width="4" stroke-linejoin="round"/><polygon points="92.0,93.3 181.2,215.8 137.6,205.3 92.0,215.8" fill="#12301a"/>
  <!-- hand gripping the tree -->
  <g class="peek">
    <path d="M150 190 C142 186 132 188 128 194 C124 200 128 206 134 206 C128 210 130 218 137 218 C132 223 136 230 143 229 C150 232 160 226 162 214 C164 200 158 192 150 190 Z" fill="#8b4a1f" stroke="#10281a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M136 200 L146 201 M138 211 L148 211 M142 222 L151 220" stroke="#10281a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>